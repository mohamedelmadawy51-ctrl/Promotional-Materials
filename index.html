<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IFT | مستلزمات الدعاية والمكتبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;}
:root{
  --blue:#0B3866;--blue2:#134A86;--blue-lg:#E8EFF8;
  --green:#54A437;--green-d:#3F812A;--green-lg:#EAF4E6;
  --paper:#F1F5F9;--card:#fff;
  --ok:#2F7A4D;--ok-bg:#E6F2EA;
  --bad:#B23A33;--bad-bg:#FBE9E7;
  --warn:#C9952B;--warn-bg:#FBF1DD;
  --muted:#64748B;--line:#E2E8F0;
  --r:14px;--sh:0 2px 8px rgba(11,56,102,.08);--shl:0 8px 24px rgba(11,56,102,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--blue);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
#app{max-width:640px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden;}

/* WELCOME */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--blue) 0%,#0a2f55 70%,#061d35 100%);color:#fff;padding:48px 28px;text-align:center;overflow-y:auto;position:relative;}
.wlogo{width:100px;height:100px;border-radius:24px;background:#fff;padding:8px;margin-bottom:24px;box-shadow:0 16px 40px rgba(0,0,0,.3);object-fit:contain;}
.welcome h1{font-size:24px;font-weight:900;margin-bottom:6px;}
.corp{font-size:10px;letter-spacing:3px;color:#8BB4D4;margin-bottom:12px;}
.welcome p{color:#A8C4DA;font-size:13px;line-height:2;max-width:300px;margin-bottom:28px;}
.stages{display:flex;gap:5px;margin-bottom:32px;flex-wrap:wrap;justify-content:center;}
.stages span{font-size:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;color:#C5DCF0;}
.btn-primary{background:var(--green);color:#fff;padding:15px 0;width:100%;max-width:300px;border-radius:13px;font-weight:800;font-size:15px;transition:.15s;box-shadow:0 10px 24px rgba(84,164,55,.35);}
.btn-primary:active{transform:scale(.97);background:var(--green-d);}
.sound-toggle{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}

/* SIGNIN */
.signin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;overflow-y:auto;}
.slogo{width:70px;height:70px;border-radius:18px;margin-bottom:18px;object-fit:contain;background:#fff;box-shadow:var(--sh);padding:6px;}
.signin h2{font-size:20px;font-weight:900;margin-bottom:4px;}
.signin .sub{color:var(--muted);font-size:12px;margin-bottom:24px;}
.signin form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:14px;background:var(--card);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);}
.err{background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:9px;margin-bottom:14px;font-size:12px;font-weight:700;}
.info-note{background:var(--blue-lg);color:var(--blue2);padding:8px 12px;border-radius:9px;margin-bottom:14px;font-size:12px;font-weight:700;}
.bottom-logo{width:36px;height:36px;object-fit:contain;opacity:.5;margin-top:20px;}

/* SHELL */
.topbar{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;padding:12px 14px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.tlogo{width:30px;height:30px;border-radius:8px;object-fit:contain;background:#fff;padding:2px;flex-shrink:0;}
.tname{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trole{font-size:10px;color:#9FC1E0;}
.logout{background:rgba(255,255,255,.1);border-radius:9px;padding:0 10px;height:34px;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}

.body-scroll{flex:1;overflow-y:auto;padding:14px 14px 90px;}
.tabbar{display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0;position:relative;z-index:5;}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;background:none;color:var(--muted);font-size:10px;font-weight:700;}
.tabbar button .ic{font-size:18px;}
.tabbar button.active{color:var(--blue);}

/* GENERIC CARD/LISTS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;}
.section-title{font-size:13px;font-weight:800;color:var(--blue);margin:18px 0 10px;display:flex;align-items:center;gap:6px;}
.section-title:first-child{margin-top:0;}
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px;}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;text-align:center;}
.kpi[data-a]{cursor:pointer;transition:transform .1s;}
.kpi[data-a]:active{transform:scale(.96);}
.kpi b{display:block;font-size:20px;font-weight:900;color:var(--blue);}
.kpi span{font-size:11px;color:var(--muted);}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
.pill{display:inline-block;font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;}
.pill.pending{background:var(--warn-bg);color:var(--warn);}
.pill.dist{background:var(--blue-lg);color:var(--blue2);}
.pill.done{background:var(--ok-bg);color:var(--ok);}
.pill.rej{background:var(--bad-bg);color:var(--bad);}
.req-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px;margin-bottom:10px;}
.req-card .rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;}
.req-card .rh b{font-size:14px;}
.req-card .meta{font-size:11px;color:var(--muted);margin-bottom:8px;}
.req-items{font-size:12px;color:var(--blue);background:var(--blue-lg);border-radius:9px;padding:8px 10px;margin-bottom:8px;}
.req-items div{display:flex;justify-content:space-between;padding:2px 0;}
.req-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-s{padding:8px 14px;border-radius:9px;font-size:12px;font-weight:800;}
.btn-s.g{background:var(--green);color:#fff;}
.btn-s.b{background:var(--blue);color:#fff;}
.btn-s.o{background:#fff;border:1.5px solid var(--line);color:var(--blue);}
.btn-s.r{background:var(--bad-bg);color:var(--bad);}

/* STEPPER (order workflow tracker) */
.tracker{display:flex;align-items:flex-start;margin:6px 0 10px;direction:ltr;}
.tracker .step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.tracker .dot{width:22px;height:22px;border-radius:50%;background:#E2E8F0;color:#94A3B8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;z-index:2;}
.tracker .step.done .dot{background:var(--ok);color:#fff;}
.tracker .step.current .dot{background:var(--blue2);color:#fff;box-shadow:0 0 0 4px var(--blue-lg);}
.tracker .step.rejected .dot{background:var(--bad);color:#fff;}
.tracker .lbl{font-size:9px;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap;direction:rtl;}
.tracker .step.done .lbl,.tracker .step.current .lbl{color:var(--blue);font-weight:700;}
.tracker .line{position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#E2E8F0;z-index:1;}
.tracker .line.filled{background:var(--ok);}
.tracker .line.rej{background:var(--bad);}

/* PRODUCT GRID */
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-bar input{flex:1;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:13px;background:#fff;}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.prod-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.prod-photo{width:100%;aspect-ratio:1/1;background:var(--blue-lg);display:flex;align-items:center;justify-content:center;color:var(--blue2);font-size:26px;font-weight:900;position:relative;overflow:hidden;}
.prod-photo img{width:100%;height:100%;object-fit:cover;}
.prod-photo .up-btn{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(11,56,102,.85);color:#fff;font-size:9px;font-weight:800;padding:4px;border-radius:7px;text-align:center;}
.prod-info{padding:8px 9px;}
.prod-info .pn{font-size:11.5px;font-weight:800;line-height:1.3;margin-bottom:4px;height:29px;overflow:hidden;}
.prod-info .ps{font-size:10px;color:var(--muted);margin-bottom:4px;}
.prod-info .pq{font-size:12px;font-weight:900;}
.prod-info .pq.low{color:var(--bad);}
.prod-info .pq.ok{color:var(--ok);}

/* FORMS */
.form-box{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px;}
.item-row{display:flex;gap:8px;align-items:center;background:var(--blue-lg);border-radius:10px;padding:8px 10px;margin-bottom:8px;}
.item-row select{flex:2;}
.item-row input{flex:1;width:60px;}
.item-row button{background:var(--bad-bg);color:var(--bad);width:30px;height:30px;border-radius:8px;font-weight:900;flex-shrink:0;}
.add-item-btn{width:100%;padding:10px;border-radius:10px;border:1.5px dashed var(--blue2);color:var(--blue2);font-weight:800;font-size:12.5px;background:transparent;margin-bottom:14px;}
.radio-group{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.radio-opt{flex:1;min-width:90px;border:1.5px solid var(--line);border-radius:11px;padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
.radio-opt.sel{border-color:var(--blue2);background:var(--blue-lg);color:var(--blue2);}

/* USERS/ADMIN */
.user-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:8px;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:11px 13px;margin-bottom:9px;}
.user-ava{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;}
.user-body{flex:1;min-width:0;}
.user-body b{font-size:13px;display:block;}
.user-body span{font-size:11px;color:var(--muted);}
.role-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--blue-lg);color:var(--blue2);}

.sector-logo-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:9px;}
.sector-logo-box{width:48px;height:48px;border-radius:10px;background:var(--blue-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--blue2);font-weight:900;}
.sector-logo-box img{width:100%;height:100%;object-fit:contain;}

.modal-bg{position:fixed;inset:0;background:rgba(6,20,38,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.center{align-items:center;padding:20px;}
.modal{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:20px;}
.modal-bg.center .modal{border-radius:18px;max-height:85vh;}
.modal h3{font-size:16px;font-weight:900;margin-bottom:14px;}
.modal-close{position:absolute;top:14px;left:14px;background:var(--blue-lg);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:900;}

.toast-msg{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:var(--shl);z-index:200;max-width:90%;text-align:center;}

/* REPORT TABLE (also used for print) */
.rep-tabs{display:flex;gap:8px;margin-bottom:12px;}
.report-table-wrap{overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh);}
table.rep-table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:640px;}
table.rep-table th{background:var(--blue-lg);color:var(--blue2);padding:8px 8px;text-align:right;white-space:nowrap;font-weight:800;}
table.rep-table td{padding:7px 8px;border-bottom:1px solid #EFEDE4;white-space:nowrap;}
.export-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;right:0;width:100%;padding:20px;}
}

@media (max-width: 380px){
  .prod-grid{grid-template-columns:repeat(2,1fr);}
}

img{cursor:zoom-in;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:zoom-out;animation:lb-in .15s ease;padding:20px;}
.lightbox-overlay img{max-width:92vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:10px;cursor:zoom-out;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.lightbox-close{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;}
@keyframes lb-in{from{opacity:0;}to{opacity:1;}}
</style>
</head>

/* ---------------- AMBIENT SOUND (synthesized, no external audio files) ---------------- */
let audioCtx = null;
let ambientNodes = [];
function startAmbient(){
  if(S.soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const master = audioCtx.createGain();
    master.gain.value = 0.05;
    master.connect(audioCtx.destination);
    const freqs = [261.63, 329.63, 392.00];
    freqs.forEach((f,i)=>{
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.value = 0;
      osc.connect(g); g.connect(master);
      osc.start();
      const now = audioCtx.currentTime;
      g.gain.linearRampToValueAtTime(0.6/(i+1), now + 2 + i*0.5);
      ambientNodes.push({osc,g});
    });
    ambientNodes.push({master});
    S.soundOn = true;
  }catch(e){ /* audio not available, ignore silently */ }
}
function stopAmbient(){
  ambientNodes.forEach(n=>{ try{ if(n.osc) n.osc.stop(); }catch(e){} });
  ambientNodes = [];
  S.soundOn = false;
}
function toggleAmbient(){ if(S.soundOn) stopAmbient(); else startAmbient(); render(); }

/* ---------------- STORAGE (Firebase Realtime Database) ---------------- */
async function loadDB(){
  // Phase 1: users only — small, so login unlocks almost instantly instead
  // of waiting on the full product/request/movement history.
  try{
    const u = await safeGet('users');
    DB.users = u ? JSON.parse(u) : SEED_USERS;
    if(!u) await fbSet('users', DB.users);
  }catch(e){ console.error('loadDB (users) error:', e); }
  usersReady = true;
  render();

  // Phase 2: everything else, in the background.
  try{
    const [p,r,m,d,sl,sp] = await Promise.all([
      safeGet('products'), safeGet('requests'), safeGet('movements'), safeGet('doctors'), safeGet('sectorLogos'), safeGet('suppliers')
    ]);
    DB.products = p ? JSON.parse(p) : SEED_PRODUCTS;
    DB.requests = r ? JSON.parse(r) : [];
    DB.movements = m ? JSON.parse(m) : [];
    DB.doctors = d ? JSON.parse(d) : SEED_DOCTORS;
    DB.sectorLogos = sl ? JSON.parse(sl) : {};
    DB.suppliers = sp ? JSON.parse(sp) : SEED_SUPPLIERS;
    if(!p) await fbSet('products', DB.products);
    if(!d) await fbSet('doctors', DB.doctors);
    if(!sp) await fbSet('suppliers', DB.suppliers);
  }catch(e){ console.error('loadDB (rest) error:', e); /* keep seed defaults already set */ }
  dbReady = true;
  render();
}
async function safeGet(key){
  try{
    const snap = await fbDB.ref(FB_ROOT + '/' + key).get();
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error('Firebase read error ('+key+'):', e); return null; }
}
async function fbSet(key, value){
  try{ await fbDB.ref(FB_ROOT + '/' + key).set(JSON.stringify(value)); }catch(e){ console.error('Firebase write error ('+key+'):', e); toast('تعذر حفظ البيانات - تحقق من الإنترنت'); }
}
async function saveUsers(){ return fbSet('users', DB.users); }

async function saveMovements(){ return fbSet('movements', DB.movements); }

  if(r.status==='rejected'){
    stages = [
      {lbl:'الطلب', state:'done'},
      {lbl:'المخزن', state:'rejected'},
      {lbl:'مرفوض', state:'rejected'}
    ];
  } else if(r.deliveryMethod==='distribution' || r.status==='assigned_distribution'){
    stages = [
      {lbl:'الطلب', state:'done'},
      {lbl:'المخزن', state: r.status==='pending_warehouse' ? 'current' : 'done'},
      {lbl:'التوزيع', state: r.status==='assigned_distribution' ? 'current' : (r.status==='delivered' ? 'done' : 'pending')},
      {lbl:'تم التسليم', state: r.status==='delivered' ? 'done' : 'pending'}
    ];
  } else {
    stages = [
      {lbl:'الطلب', state:'done'},
      {lbl:'المخزن', state: r.status==='pending_warehouse' ? 'current' : 'done'},
      {lbl:'تم التسليم', state: r.status==='delivered' ? 'done' : 'pending'}
    ];
  }
  const renderStages = stages.slice().reverse();
  return `<div class="tracker">${renderStages.map((s,i)=>{
    const prev = i>0 ? renderStages[i-1] : null;
    let lineClass = '';
    if(prev){
      if(prev.state==='rejected') lineClass = 'rej';
      else if(prev.state==='done' || prev.state==='current') lineClass = 'filled';
    }
    return `
    <div class="step ${s.state==='done'?'done':s.state==='current'?'current':s.state==='rejected'?'rejected':''}">
      ${i>0?`<div class="line ${lineClass}"></div>`:''}
      <div class="dot">${s.state==='done'?'✓':s.state==='rejected'?'✕':''}</div>
      <div class="lbl">${s.lbl}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ---------------- ORDERS (searchable full history) ---------------- */
let ordersSearch = '';
let ordersDateFilter = '';
function reqSector(r){
  const first = r.items && r.items[0];
  return (first && (findProduct(first.productId)||{}).sector) || r.sector || 'عام';
}
function activityDates(){
  const set = new Set();
  DB.requests.forEach(r=>{ set.add(new Date(r.createdAt).toISOString().slice(0,10)); });
  return [...set].sort((a,b)=>b.localeCompare(a));
}
function ordersFiltered(){
  const u = S.user;
  let list = DB.requests;
  if(u.role==='requester'){ list = list.filter(r=>r.createdBy===u.username); }
  if(ordersDateFilter){
    list = list.filter(r=> new Date(r.createdAt).toISOString().slice(0,10) === ordersDateFilter );
  }
  if(ordersSearch){
    const q = ordersSearch.toLowerCase();
    list = list.filter(r=>{
      const hay = [reqSector(r), r.doctorName, r.createdByName, r.place, ...(r.items||[]).map(it=>it.name)].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  return [...list].sort((a,b)=>b.createdAt-a.createdAt);
}
function rOrders(){
  const dates = activityDates();
  const filtered = ordersFiltered();
  return `
  <div class="section-title">🔍 بحث الطلبات</div>
  <div class="search-bar"><input id="ord-search" placeholder="ابحث بالقطاع، الدكتور، الطالب، أو المنتج..." value="${ordersSearch}"></div>

        return `<option value="${d}" ${ordersDateFilter===d?'selected':''}>${label} — ${cnt} حركة</option>`;
      }).join('')}

  </div>
  <div id="orders-list">${filtered.length===0?'<div class="empty-state">لا توجد طلبات مطابقة</div>':filtered.map(reqCardHTML).join('')}</div>
  `;

/* ---------------- REPORTS ---------------- */
let repTab = 'summary';
let repDateFrom = '';
let repDateTo = '';
function dayStartMs(dateStr){ const d = new Date(dateStr+'T00:00:00'); return d.getTime(); }
function dayEndMs(dateStr){ const d = new Date(dateStr+'T23:59:59'); return d.getTime(); }
function inDateRange(ts){
  if(!ts) return false;
  if(repDateFrom && ts < dayStartMs(repDateFrom)) return false;
  if(repDateTo && ts > dayEndMs(repDateTo)) return false;
  return true;
}
function setLastWeekFilter(){
  const to = new Date();
  const from = new Date(); from.setDate(from.getDate()-7);
  repDateTo = to.toISOString().slice(0,10);
  repDateFrom = from.toISOString().slice(0,10);
}
function buildIncomingRows(){
  return DB.movements
    .filter(m=> (repDateFrom||repDateTo) ? inDateRange(m.date) : true)
    .slice()
    .sort((a,b)=> b.date - a.date)
    .map(m=>({
    'التاريخ والوقت': fmtDateTime(m.date),
    'المورد': m.supplier || '—',
    'الصنف': m.name,
    'القطاع': (findProduct(m.productId)||{}).sector || 'عام',
    'الطالب': m.requestedBy || m.byName || '—',
    'المستلم': m.receivedBy || m.byName || '—',
    'الكمية': m.qty
  }));
}
function buildDeliveryRows(){
  return DB.requests
    .filter(r=>r.status==='delivered')
    .filter(r=> (repDateFrom||repDateTo) ? inDateRange(r.deliveredAt||r.createdAt) : true)
    .slice()
    .sort((a,b)=> (b.deliveredAt||b.createdAt) - (a.deliveredAt||a.createdAt))
    .map(r=>{
    const sector = (findProduct(r.items[0] && r.items[0].productId)||{}).sector || r.sector || 'عام';
    const qtyTotal = r.items.reduce((s,it)=>s+Number(it.qty||0),0);
    const itemNames = r.items.map(it=>it.name).join('، ');
    return {
      'التاريخ': fmtDateTime(r.deliveredAt||r.createdAt),
      'الصنف': itemNames,
      'القطاع': sector,
      'الكمية': qtyTotal,
      'الطالب': r.createdByName,
      'مكان التسليم': r.place || r.doctorName || r.region || '—',
      'من سلّم': r.deliveredBy ? (DB.users.find(u=>u.username===r.deliveredBy)||{}).name || r.deliveredBy : '—'
    };
  });
}
function rReports(){
  const totalReq = DB.requests.length;
  const delivered = DB.requests.filter(r=>r.status==='delivered').length;
  const pending = DB.requests.filter(r=>r.status==='pending_warehouse').length;
  const inTransit = DB.requests.filter(r=>r.status==='assigned_distribution').length;
  const rejected = DB.requests.filter(r=>r.status==='rejected').length;

  </div>
  <div class="kpi-row">
    <div class="kpi"><b>${pending}</b><span>بانتظار المخزن</span></div>
    <div class="kpi"><b>${inTransit}</b><span>قيد التسليم</span></div>
  </div>
  <div class="kpi-row">

  <div class="rep-tabs">

    <div class="radio-opt ${repTab==='out'?'sel':''}" data-a="rep-tab" data-t="out" style="flex:1;">تقرير الصرف (${outRows.length})</div>
  </div>

  <div class="form-box" style="margin:10px 0;padding:10px;">
    <div style="font-size:12px;font-weight:800;margin-bottom:8px;">تصفية بالتاريخ (تنطبق على التوريد والصرف معًا)</div>
    <div style="display:flex;gap:8px;">
      <div class="field" style="flex:1;"><label>من تاريخ</label><input type="date" id="rep-date-from" value="${repDateFrom}"></div>
      <div class="field" style="flex:1;"><label>إلى تاريخ</label><input type="date" id="rep-date-to" value="${repDateTo}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn-s g" data-a="rep-last-week" style="flex:1;">📅 آخر أسبوع</button>

  `;

function renderReportTable(rows, filenameBase){
  if(rows.length===0) return '<div class="empty-state">لا توجد بيانات لعرضها بعد</div>';
  const cols = Object.keys(rows[0]);
  return `
  <div class="export-row">
    <button class="btn-s g" data-a="export-excel" data-file="${filenameBase}">⬇️ تصدير Excel</button>
    <button class="btn-s b" data-a="export-print" data-file="${filenameBase}">🖨️ طباعة / PDF</button>
  </div>
  <div class="report-table-wrap">
    <table class="rep-table" id="rep-table-current">
      <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody>

function exportExcel(rows, filenameBase){
  if(!window.XLSX){ toast('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'تقرير');
  XLSX.writeFile(wb, filenameBase + '.xlsx');
}
function printReport(rows, title){
  if(rows.length===0){ toast('لا توجد بيانات للطباعة'); return; }
  const cols = Object.keys(rows[0]);
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${title}</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;padding:20px;direction:rtl;}
    h2{text-align:center;color:#0B3866;margin-bottom:16px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;}
    th{background:#E8EFF8;color:#0B3866;}
  </style></head><body>
  <h2>IFT Corporation — ${title}</h2>
  <table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody></table>
  </body></html>`);
  w.document.close();
  setTimeout(()=>{ w.print(); }, 300);
}

/* ============================== EVENTS ============================== */
function bindEvents(){
  document.querySelectorAll('[data-a]').forEach(el=>{
    if(el.tagName==='INPUT' && el.type==='file') return;
    el.addEventListener('click', onAction);
  });
  document.querySelectorAll('input[data-a="upload-photo"]').forEach(el=>{ el.addEventListener('change', onUploadPhoto); });
  document.querySelectorAll('input[data-a="upload-sector-logo"]').forEach(el=>{ el.addEventListener('change', onUploadSectorLogo); });
  const sif = document.getElementById('sif');
  if(sif) sif.addEventListener('submit', onSignIn);
  const ps = document.getElementById('prod-search');
  if(ps) ps.addEventListener('input', e=>{ productSearch = e.target.value; renderProductsOnly(); });
  document.querySelectorAll('.ni-qty').forEach(el=>{
    el.addEventListener('change', e=>{
      const idx = +e.target.dataset.idx;
      newReqItems[idx].qty = +e.target.value || 1;
    });
  });
  document.querySelectorAll('#in-source-group .radio-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('#in-source-group .radio-opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
    });
  });
  const nrDoctor = document.getElementById('nr-doctor');
  if(nrDoctor) nrDoctor.addEventListener('change', onDoctorSelectChange);
  const nrRegion = document.getElementById('nr-region');
  if(nrRegion) nrRegion.addEventListener('change', e=>{ newReqForm.region = e.target.value; });
  const nrPlace = document.getElementById('nr-place');
  if(nrPlace) nrPlace.addEventListener('input', e=>{ newReqForm.place = e.target.value; });
  const nrNotes = document.getElementById('nr-notes');
  if(nrNotes) nrNotes.addEventListener('input', e=>{ newReqForm.notes = e.target.value; });
  const inSupplier = document.getElementById('in-supplier');
  if(inSupplier) inSupplier.addEventListener('change', onSupplierSelectChange);
  const ordDate = document.getElementById('ord-date-filter');
  if(ordDate) ordDate.addEventListener('change', e=>{ ordersDateFilter = e.target.value; render(); });
  const ordSearch = document.getElementById('ord-search');
  if(ordSearch) ordSearch.addEventListener('input', e=>{ ordersSearch = e.target.value; renderOrdersOnly(); });
  const auRole = document.getElementById('au-role');
  if(auRole){ auRole.addEventListener('change', toggleSectorField); toggleSectorField(); }
  const repFrom = document.getElementById('rep-date-from');
  if(repFrom) repFrom.addEventListener('change', e=>{ repDateFrom = e.target.value; render(); });
  const repTo = document.getElementById('rep-date-to');
  if(repTo) repTo.addEventListener('change', e=>{ repDateTo = e.target.value; render(); });
}
function toggleSectorField(){
  const roleSel = document.getElementById('au-role');
  const sectorField = document.getElementById('au-sector-field');
  if(!roleSel || !sectorField) return;
  sectorField.style.display = roleSel.value==='requester' ? 'block' : 'none';
}

      DB.suppliers.push(name.trim());

function renderProductsOnly(){

function onAction(e){
  const a = e.currentTarget.dataset.a;
  const id = e.currentTarget.dataset.id;
  if(a==='go-si'){ stopAmbient(); S.screen='signin'; render(); }
  else if(a==='toggle-sound'){ toggleAmbient(); }
  else if(a==='logout'){ stopAmbient(); S.user=null; S.screen='welcome'; S.tab='home'; render(); }
  else if(a==='tab'){ S.tab = e.currentTarget.dataset.tab; render(); }
  else if(a==='add-item'){ newReqItems.push({productId:'',qty:1}); render(); }
  else if(a==='rm-item'){ const idx=+e.currentTarget.dataset.idx; newReqItems.splice(idx,1); if(newReqItems.length===0) newReqItems=[{productId:'',qty:1}]; render(); }
  else if(a==='submit-request'){ submitNewRequest(); }
  else if(a==='submit-incoming'){ submitIncoming(); }
  else if(a==='wh-direct'){ warehouseDirectDeliver(id); }
  else if(a==='wh-assign'){ openAssignModal(id); }
  else if(a==='wh-reject'){ warehouseReject(id); }
  else if(a==='admin-cancel-req'){ adminCancelRequest(id); }
  else if(a==='kpi-modal'){ openKpiModal(e.currentTarget.dataset.kpi); }
  else if(a==='kpi-export-excel'){ exportExcel(kpiModalRows, kpiModalFile); }
  else if(a==='kpi-export-print'){ printReport(kpiModalRows, kpiModalTitle); }
  else if(a==='dist-deliver'){ distDeliver(id); }
  else if(a==='admin-tab'){ adminTab = e.currentTarget.dataset.t; render(); }
  else if(a==='add-user'){ addUser(); }
  else if(a==='del-user'){ delUser(e.currentTarget.dataset.un); }
  else if(a==='edit-user'){ openEditUserModal(e.currentTarget.dataset.un); }
  else if(a==='save-edit-user'){ saveEditUser(e.currentTarget.dataset.un); }
  else if(a==='add-product'){ addProduct(); }
  else if(a==='confirm-assign'){ confirmAssign(id); }
  else if(a==='close-modal'){ closeModal(); }
  else if(a==='open-picker'){ openProductPicker(+e.currentTarget.dataset.idx); }
  else if(a==='pick-product'){ selectPickedProduct(+e.currentTarget.dataset.idx, +e.currentTarget.dataset.pid); }
  else if(a==='rep-tab'){ repTab = e.currentTarget.dataset.t; render(); }
  else if(a==='rep-last-week'){ setLastWeekFilter(); render(); }
  else if(a==='rep-clear-dates'){ repDateFrom=''; repDateTo=''; render(); }
  else if(a==='export-excel'){ exportExcel(repTab==='in'?buildIncomingRows():buildDeliveryRows(), e.currentTarget.dataset.file); }
  else if(a==='export-print'){ printReport(repTab==='in'?buildIncomingRows():buildDeliveryRows(), repTab==='in'?'تقرير التوريد':'تقرير الصرف والتسليم'); }
}

function onSignIn(e){
  e.preventDefault();
  const un = e.target.un.value.trim();
  const pw = e.target.pw.value;
  if(!usersReady){ S.err='البيانات لسه بتتحمّل، حاول تاني بعد ثانيتين'; render(); return; }
  const u = DB.users.find(x=>x.username===un && x.password===pw);
  if(!u){ S.err='اسم المستخدم أو كلمة المرور غير صحيحة'; render(); return; }
  S.user = u; S.err=null; S.screen='shell'; S.tab='home';

/* ---- Request creation ---- */
function submitNewRequest(){
  const doctorName = (newReqForm.doctor||'').trim();
  const region = (newReqForm.region||'').trim();
  const place = (newReqForm.place||'').trim();
  const notes = (newReqForm.notes||'').trim();
  const items = newReqItems.filter(it=>it.productId).map(it=>{
    const p = findProduct(+it.productId);
    return { productId:+it.productId, name:p.name, unit:p.unit, qty:it.qty };
  });
  if(!doctorName || doctorName==='__new__'){ toast('من فضلك اختر اسم الطبيب / العيادة'); return; }
  if(items.length===0){ toast('أضف صنف واحد على الأقل'); return; }
  const req = {
    id: uid('req_'), createdBy:S.user.username, createdByName:S.user.name, createdAt:Date.now(),
    doctorName, region:(region==='بدون تحديد'?'':region), place, sector:S.user.sector||null, items, notes, status:'pending_warehouse'
  };
  DB.requests.push(req); saveRequests();
  newReqItems = [{productId:'',qty:1}];
  newReqForm = { doctor:'', region:'بدون تحديد', place:'', notes:'' };
  toast('تم إرسال الطلب للمخزن بنجاح');
  S.tab='home'; render();
}

/* ---- Incoming stock ---- */
function submitIncoming(){
  const pid = +document.getElementById('in-prod').value;
  const qty = +document.getElementById('in-qty').value;
  const src = document.querySelector('#in-source-group .radio-opt.sel').dataset.src;
  const supplier = document.getElementById('in-supplier').value.trim();
  if(supplier==='__new__'){ toast('اختر مورد صحيح'); return; }
  const requestedBy = document.getElementById('in-requester').value;
  const receivedBy = document.getElementById('in-receiver').value;
  const notes = document.getElementById('in-notes').value.trim();
  if(!pid){ toast('اختر صنف'); return; }
  if(!qty || qty<=0){ toast('أدخل كمية صحيحة'); return; }
  const p = findProduct(pid);
  p.stock += qty;
  DB.movements.push({ id:uid('mv_'), productId:pid, name:p.name, qty, source:src, supplier, requestedBy, receivedBy, date:Date.now(), by:S.user.username, byName:S.user.name, notes });
  saveProducts(); saveMovements();
  toast('تم تسجيل التوريد وتحديث الرصيد');
  render();
}

/* ---- Warehouse actions ---- */
function hasEnoughStock(r){ return r.items.every(it=>{ const p=findProduct(it.productId); return p && p.stock>=it.qty; }); }
function deductStock(r){ r.items.forEach(it=>{ const p=findProduct(it.productId); if(p) p.stock -= it.qty; }); }

function warehouseDirectDeliver(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!hasEnoughStock(r)){ if(!confirm('الرصيد غير كافٍ لبعض الأصناف — هل تريد المتابعة على مسؤوليتك؟')) return; }
  deductStock(r);
  r.status='delivered'; r.deliveryMethod='direct'; r.preparedBy=S.user.username; r.preparedAt=Date.now(); r.deliveredBy=S.user.username; r.deliveredAt=Date.now();
  saveProducts(); saveRequests();
  toast('تم تسليم الطلب مباشرة للطبيب');
  render();
}
function warehouseReject(id){
  const reason = prompt('سبب الرفض (اختياري):','نقص في الرصيد');
  const r = DB.requests.find(x=>x.id===id);
  r.status='rejected'; r.rejectReason = reason||''; r.preparedBy=S.user.username; r.preparedAt=Date.now();
  saveRequests();
  toast('تم رفض الطلب');
  render();
}
function adminCancelRequest(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  if(r.status==='delivered'){ toast('لا يمكن إلغاء طلب تم تسليمه بالفعل'); return; }
  if(r.status==='rejected'){ toast('الطلب ملغى بالفعل'); return; }
  if(!confirm('هل أنت متأكد من إلغاء هذا الطلب؟')) return;
  if(r.status==='assigned_distribution'){
    // stock was already deducted when the request was assigned — restore it
    r.items.forEach(it=>{ const p=findProduct(it.productId); if(p) p.stock += Number(it.qty||0); });
    saveProducts();
  }
  r.status='rejected';
  r.rejectReason = 'تم الإلغاء بواسطة الإدارة';
  r.cancelledBy = S.user.username; r.cancelledAt = Date.now();
  saveRequests();
  toast('تم إلغاء الطلب' + (r.items ? ' وإرجاع الرصيد إن لزم' : ''));
  render();
}

/* ---------------- HOME KPI QUICK REPORTS ---------------- */
let kpiModalRows = [];
let kpiModalFile = 'تقرير';
let kpiModalTitle = 'تقرير';
function kpiRowsFor(type){
  const u = S.user;
  const myReqs = DB.requests.filter(r=> r.createdBy===u.username );
  const pendingWh = DB.requests.filter(r=>r.status==='pending_warehouse');
  const myTasks = DB.requests.filter(r=> r.status==='assigned_distribution' && r.assignedTo===u.username );
  const prodRow = p => ({'الصنف':p.name,'القطاع':p.sector||'عام','الوحدة':p.unit,'الرصيد':p.stock});
  const reqRow = r => ({'رقم الطلب':r.id.slice(-6),'الطبيب':r.doctorName,'الحالة':statusLabel(r.status),'الطالب':r.createdByName,'التاريخ':fmtDateTime(r.createdAt),'القطاع':reqSector(r)});
  switch(type){
    case 'total-products': return { title:'إجمالي الأصناف', file:'تقرير-إجمالي-الأصناف', rows: DB.products.map(prodRow) };
    case 'low-stock': return { title:'أصناف منخفضة الرصيد', file:'تقرير-أصناف-منخفضة', rows: DB.products.filter(p=>p.stock>0&&p.stock<=5).map(prodRow) };
    case 'zero-stock': return { title:'أصناف نفدت من المخزن', file:'تقرير-أصناف-نافدة', rows: DB.products.filter(p=>p.stock<=0).map(prodRow) };
    case 'pending-warehouse': return { title:'طلبات بانتظار المخزن', file:'تقرير-طلبات-بانتظار-المخزن', rows: pendingWh.map(reqRow) };
    case 'my-requests': return { title:'طلباتي', file:'تقرير-طلباتي', rows: myReqs.map(reqRow) };
    case 'my-delivered': return { title:'طلباتي المُسلَّمة', file:'تقرير-طلباتي-المسلمة', rows: myReqs.filter(r=>r.status==='delivered').map(r=>({'رقم الطلب':r.id.slice(-6),'الطبيب':r.doctorName,'تاريخ التسليم':fmtDateTime(r.deliveredAt||r.createdAt)})) };
    case 'my-tasks': return { title:'مهام تسليم لديك', file:'تقرير-مهام-التسليم', rows: myTasks.map(reqRow) };
    case 'my-tasks-delivered': return { title:'مهام تم تسليمها', file:'تقرير-مهام-مُسلَّمة', rows: DB.requests.filter(r=>r.status==='delivered'&&r.assignedTo===u.username).map(r=>({'رقم الطلب':r.id.slice(-6),'الطبيب':r.doctorName,'تاريخ التسليم':fmtDateTime(r.deliveredAt||r.createdAt)})) };
    default: return { title:'تقرير', file:'تقرير', rows: [] };
  }
}

  const {title, file, rows} = kpiRowsFor(type);

    <h3>${title} (${rows.length})</h3>

    <div class="export-row">
      <button class="btn-s g" data-a="kpi-export-excel">⬇️ تصدير Excel</button>
      <button class="btn-s b" data-a="kpi-export-print">🖨️ طباعة / PDF</button>
    </div>
    <div class="report-table-wrap">
      <table class="rep-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </div>`}
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('[data-a="close-modal"]').addEventListener('click', closeModal);
  bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(); });
}

/* ---- Admin: users/products/sector logos ---- */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality||0.75));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addUser(){
  const username = document.getElementById('au-username').value.trim();
  const password = document.getElementById('au-password').value;
  const name = document.getElementById('au-name').value.trim();
  const role = document.getElementById('au-role').value;
  const sector = role==='requester' ? document.getElementById('au-sector').value : null;
  const photoFile = document.getElementById('au-photo').files[0];
  if(!username || !password || !name){ toast('املأ كل الحقول'); return; }
  if(DB.users.find(u=>u.username===username)){ toast('اسم المستخدم موجود بالفعل'); return; }
  const photo = photoFile ? await resizeImageFile(photoFile, 200, 0.8) : null;
  DB.users.push({username,password,name,role,sector,photo});
  saveUsers();
  toast('تمت إضافة المستخدم');
  render();
}
function delUser(un){
  if(!confirm('حذف هذا المستخدم؟')) return;
  DB.users = DB.users.filter(u=>u.username!==un);
  saveUsers();
  render();
}

    <h3>تعديل المستخدم @${u.username}</h3>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">${avatarHTML(u,54)}
      <div class="field" style="flex:1;"><label>تغيير الصورة</label><input type="file" accept="image/*" id="eu-photo"></div>
    </div>
    <div class="field"><label>الاسم الظاهر</label><input id="eu-name" value="${u.name}"></div>

      </select>

      <label>القطاع / الشركة</label>
      <select id="eu-sector">${sectors.map(s=>`<option value="${s}" ${s===u.sector?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <button class="btn-primary" style="margin-top:14px;max-width:100%;" data-a="save-edit-user" data-un="${u.username}">حفظ التعديلات</button>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('[data-a="close-modal"]').addEventListener('click', closeModal);
  bg.querySelector('[data-a="save-edit-user"]').addEventListener('click', ()=>saveEditUser(u.username));
  bg.querySelector('#eu-role').addEventListener('change', (e)=>{
    document.getElementById('eu-sector-field').style.display = e.target.value==='requester' ? 'block' : 'none';
  });
}
async function saveEditUser(un){
  const u = DB.users.find(x=>x.username===un);
  if(!u) return;
  u.name = document.getElementById('eu-name').value.trim() || u.name;
  u.password = document.getElementById('eu-password').value || u.password;
  u.role = document.getElementById('eu-role').value;
  u.sector = u.role==='requester' ? document.getElementById('eu-sector').value : null;
  const photoFile = document.getElementById('eu-photo').files[0];
  if(photoFile){ u.photo = await resizeImageFile(photoFile, 200, 0.8); }
  await saveUsers();
  closeModal();
  if(S.user && S.user.username===u.username) S.user = u;
  toast('تم حفظ تعديلات المستخدم');
  render();
}
function addProduct(){
  const name = document.getElementById('ap-name').value.trim();
  const sector = document.getElementById('ap-sector').value.trim();
  const unit = document.getElementById('ap-unit').value.trim() || 'Each';
  const stock = +document.getElementById('ap-stock').value || 0;
  if(!name){ toast('اكتب اسم الصنف'); return; }
  const maxId = DB.products.reduce((m,p)=>Math.max(m,p.id),0);
  DB.products.push({ id:maxId+1, name, sector, unit, stock, photo:null });
  saveProducts();
  toast('تمت إضافة الصنف');
  render();
}

/* ---- Photo uploads ---- */
function onUploadPhoto(e){
  const file = e.target.files[0];
  const pid = +e.target.dataset.id;
  if(!file) return;
  resizeImageFile(file, 260, 0.72).then(dataUrl=>{
    const p = findProduct(pid);
    p.photo = dataUrl;
    saveProducts();
    toast('تم رفع الصورة');
    render();
  });
}
function onUploadSectorLogo(e){
  const file = e.target.files[0];
  const sector = e.target.dataset.sector;
  if(!file) return;
  resizeImageFile(file, 200, 0.85).then(dataUrl=>{
    DB.sectorLogos[sector] = dataUrl;
    saveSectorLogos();
    toast('تم رفع شعار القطاع');
    render();
  });
}
